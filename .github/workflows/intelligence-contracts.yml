name: Assistant integration contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # The contract suite uses actual app modules with explicit in-memory
      # transport/filesystem adapters. It needs no native SDK or service key.
      - run: npm test
