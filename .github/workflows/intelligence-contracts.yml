name: Assistant integration contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # Installed security dependency contracts need no native SDK/service key.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
